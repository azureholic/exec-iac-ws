# nginx vhost for the StayBright SPA.
# `__API_INTERNAL_FQDN__` is rewritten to the backend container app's
# in-env FQDN at container start by /docker-entrypoint.sh, using the
# API_INTERNAL_FQDN env var injected by the platform-team Bicep.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache on hashed Vite assets; never cache the HTML entry.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Reverse-proxy API calls to the backend container app over the
    # internal Container Apps ingress (HTTP on port 80).
    location /api/ {
        proxy_pass http://__API_INTERNAL_FQDN__;
        proxy_http_version 1.1;
        proxy_set_header Host __API_INTERNAL_FQDN__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # SPA fallback — every unknown path renders index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
