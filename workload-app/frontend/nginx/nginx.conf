user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;
    types_hash_max_size 2048;

    # The Azure Linux nginx base image's stock nginx.conf only includes
    # /etc/nginx/nginx.conf.default (which ships its own `server { localhost }`
    # block) and does NOT include /etc/nginx/conf.d/*.conf, so any vhost we
    # drop in conf.d/ would be silently ignored. This replacement file wires
    # conf.d/ back in the way the upstream nginx image does.
    include /etc/nginx/conf.d/*.conf;
}
