name: Infra — deploy spoke

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'
  workflow_dispatch:

# Default least-privilege token. id-token: write is added per-job for OIDC login.
permissions:
  contents: read

concurrency:
  group: infra-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TEMPLATE_FILE: infra/spoke.bicep
  AZURE_LOCATION: swedencentral

jobs:
  lint:
    name: Lint Bicep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bicep build (lint)
        run: az bicep build --file ${{ env.TEMPLATE_FILE }}

  deploy-test:
    name: Deploy → test
    runs-on: ubuntu-latest
    needs: lint
    environment: test
    permissions:
      id-token: write
      contents: read
    env:
      PARAM_FILE: infra/spoke.test.bicepparam
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: |
          az group create \
            --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --location "${{ env.AZURE_LOCATION }}" \
            --output none

      - name: What-if
        run: |
          set -euo pipefail
          {
            echo "## What-if — test (\`${{ vars.AZURE_RESOURCE_GROUP }}\`)"
            echo
            echo '```'
            az deployment group what-if \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --template-file "${{ env.TEMPLATE_FILE }}" \
              --parameters "${{ env.PARAM_FILE }}" \
              --no-pretty-print
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "spoke-test-${{ github.run_id }}" \
            --template-file "${{ env.TEMPLATE_FILE }}" \
            --parameters "${{ env.PARAM_FILE }}" \
            --output table

  deploy-prod:
    name: Deploy → prod
    runs-on: ubuntu-latest
    needs: deploy-test
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      PARAM_FILE: infra/spoke.prod.bicepparam
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: |
          az group create \
            --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --location "${{ env.AZURE_LOCATION }}" \
            --output none

      - name: What-if
        run: |
          set -euo pipefail
          {
            echo "## What-if — prod (\`${{ vars.AZURE_RESOURCE_GROUP }}\`)"
            echo
            echo '```'
            az deployment group what-if \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --template-file "${{ env.TEMPLATE_FILE }}" \
              --parameters "${{ env.PARAM_FILE }}" \
              --no-pretty-print
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "spoke-prod-${{ github.run_id }}" \
            --template-file "${{ env.TEMPLATE_FILE }}" \
            --parameters "${{ env.PARAM_FILE }}" \
            --output table
